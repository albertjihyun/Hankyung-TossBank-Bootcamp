spring:
  application:
    name: jarvis-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate  # 스키마 원본은 docs/backend/schema.sql — JPA는 만들지도 바꾸지도 않음 (03 §3-1)
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

# 인증 (03 D3 — AT 30분 / RT 14일, 시크릿은 환경변수)
jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: 30
  refresh-token-days: 14

# mock 전이 간격 (01 §6 — 환경변수 아님, yml 기본값)
app:
  mock:
    shipping-minutes: 5
    delivery-minutes: 5
    confirm-minutes: 10
    claim-approve-minutes: 5
