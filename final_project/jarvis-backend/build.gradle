// 로컬 셋업 스크립트가 앱을 띄우기 전에 스키마를 만들 때 쓴다(./gradlew flywayMigrate) — 앱 기동 시 적용과
// 같은 파일·같은 이력 테이블이라, 손으로 schema.sql을 흘린 DB에 다음 V번호가 중복 적용되는 일이 없다(02 D54).
// 버전은 Spring Boot가 앱에 넣는 Flyway·드라이버와 맞춘다
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.flywaydb:flyway-mysql:11.7.2'
        classpath 'org.mariadb.jdbc:mariadb-java-client:3.5.8'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '11.7.2'
}

flyway {
    locations = ['filesystem:src/main/resources/db/migration']
    baselineOnMigrate = true
    baselineVersion = '1'
    cleanDisabled = true
}

group = 'com.jarvis'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // S3 presigned URL 발급 (S-6). Spring Boot BOM이 awssdk를 관리하지 않아 BOM을 따로 얹는다.
    // 자격증명은 인스턴스 IAM 역할 — 기본 체인이 알아서 찾으므로 키를 주입하지 않는다.
    implementation platform('software.amazon.awssdk:bom:2.28.29')
    implementation 'software.amazon.awssdk:s3'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    // 스키마 마이그레이션 (02 D54) — 사람이 SQL을 순서대로 흘리던 것을 앱 기동 시 자동 적용으로 바꾼다.
    // MariaDB 지원은 flyway-mysql 모듈에 있다(Flyway 10+)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // 행동 이벤트 스트림 (08 §0) — 프로듀서·컨슈머 모두 앱 안에 둔다 (08 D9)
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // 스케줄러 분산 락 (03 §4, D-분산5 — 틱당 1대만 실행, 단일 인스턴스에서도 무해)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.2.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:6.2.0'

    // JWT (03 §4 — jjwt, OAuth 제외로 oauth2-client 미도입)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 실제 MariaDB를 띄우는 통합 테스트 — 네이티브 SQL 문법·DB 제약·조건부 UPDATE 동시성은 목으로 검증되지 않는다.
    // Docker가 없으면 건너뛴다(support/DockerRequired)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
