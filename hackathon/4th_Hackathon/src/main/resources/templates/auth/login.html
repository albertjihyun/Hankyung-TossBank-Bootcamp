<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: pagehead('로그인')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main class="container narrow">
    <h1>로그인</h1>

    <div th:if="${param.error}" class="alert alert-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div th:if="${param.logout}" class="alert">로그아웃되었습니다.</div>
    <div th:if="${param.signup}" class="alert alert-ok">회원가입이 완료되었습니다. 로그인하세요.</div>

    <form th:action="@{/login}" method="post" class="form">
        <label>아이디
            <input type="text" name="username" required autofocus>
        </label>
        <label>비밀번호
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
    </form>

    <p class="muted">데모 계정: user1 / user123 · host1 / host123 · admin / admin123</p>
    <p>계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
